<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Container background with squircle radius -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tvBg)"/>

  <!-- TV Antenna -->
  <polyline points="44 14 32 23 20 14" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- TV Screen Outer Frame -->
  <rect x="10" y="23" width="44" height="31" rx="4" fill="url(#screenBg)" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Play Triangle inside Screen -->
  <polygon points="27 32 39 38.5 27 45" fill="#38bdf8"/>

  <!-- Live Pulse Dot -->
  <circle cx="45" cy="30" r="2.5" fill="#22c55e"/>
</svg>

